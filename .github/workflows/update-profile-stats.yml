name: Update GitHub profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *' # Daily at 06:17 in Brasilia (UTC-3)

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Require private stats token
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
        run: |
          if [ -z "$STATS_PAT" ]; then
            echo "::error::Add the STATS_PAT repository secret before running this workflow."
            exit 1
          fi

      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Derson396&show_icons=true&theme=tokyonight&hide_border=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR

          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}
          fail_on_error: 'true'

      - name: Generate public top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Derson396&layout=compact&theme=tokyonight&hide_border=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR&hide=PureBasic,CSS&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'


      - name: Publish generated cards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          content = content.replace(
              "https://github-stats-extended.vercel.app/api?username=Derson396&show_icons=true&theme=tokyonight&hide_border=true",
              "./profile/stats.svg",
          )
          content = content.replace(
              "https://github-stats-extended.vercel.app/api/top-langs/?username=Derson396&layout=compact&theme=tokyonight&hide_border=true",
              "./profile/top-langs.svg",
          )
          readme.write_text(content, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/stats.svg profile/top-langs.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile stats cards"
            git push
          fi

